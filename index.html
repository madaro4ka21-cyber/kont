<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кликер за 10 секунд</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Кликер за 10 секунд</h1>
    <button id="clickBtn">Кликай!</button>
    <p id="score">Клики: 0</p>
    <p id="timer">Осталось: 10 сек</p>
    <p id="result" class="hidden"></p>
    <p id="date" class="hidden"></p>
    <button id="restartBtn" class="hidden">Заново</button>
  </div>
  <script src="main.js"></script>
</body>
</html>
